spring.application.name=tvtmp3-backend

# ===============================
# SERVER
# ===============================
server.port=8080


# ===============================
# NẠP BIẾN MÔI TRƯỜNG TỪ FILE .env
# ===============================
# Spring Boot KHÔNG tự đọc file .env — dòng này nạp backend/.env
# (đã nằm trong .gitignore, không bị push lên GitHub).
# - optional: => .env không tồn tại cũng không báo lỗi
# - [.properties] => parse .env theo định dạng KEY=VALUE
spring.config.import=optional:file:.env[.properties]


# ===============================
# DATABASE - MYSQL
# ===============================
# CHÚ Ý: không được có dấu cách sau dấu "=" — nếu không giá trị sẽ
# dính khoảng trắng ở đầu (VD username thành " root" -> lỗi kết nối DB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# DATABASE DIALECT
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# JWT
# ===============================
# Khóa bí mật để ký token (HS256 yêu cầu >= 32 ký tự).
# Giá trị mặc định chỉ để chạy dev; production PHẢI đặt biến môi trường
# JWT_SECRET và không commit secret thật lên git.
app.jwt.secret=${JWT_SECRET:tvtmp3-dev-secret-key-please-change-in-production-123456}

# Token có hiệu lực 7 ngày (tính bằng miligiây)
app.jwt.expiration-ms=604800000